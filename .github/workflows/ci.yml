name: CI

on:
  push:
  pull_request:
  schedule:
    # Týždenne — zachytí novú patch/minor verziu Zabbixu (tag *-latest) aj bez commitu
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  zabbix-compat:
    # Adapter proti reálnemu Zabbixu každej podporovanej verzie.
    # Zoznam verzií drží zabbix_adapter.TESTED_VERSIONS — pri zmene ho uprav aj tu.
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        zabbix: ['6.0', '7.0', '7.4', '8.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'zabbix_utils>=2.0.5'
      - name: Start Zabbix ${{ matrix.zabbix }}
        run: docker compose -f tests/docker-compose.yml up -d
        env:
          ZABBIX_VERSION: ${{ matrix.zabbix }}
      - name: Integration check
        run: python tests/integration_check.py
        env:
          EXPECT_VERSION: ${{ matrix.zabbix }}
      - name: Zabbix logs on failure
        if: failure()
        run: docker compose -f tests/docker-compose.yml logs --tail=100
        env:
          ZABBIX_VERSION: ${{ matrix.zabbix }}
